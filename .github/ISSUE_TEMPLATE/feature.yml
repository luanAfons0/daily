name: Feature request
description: Daily should be able to do something it cannot do today.
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Daily is deliberately small: Entries that move from Cycle to Cycle,
        Notes that never move, and the Markdown for the Meeting. It has no
        clock, because Scheduler owns one. A request that gives it a second
        job is likely to be refused, and that is not a judgement on the idea.
        Read [CONTEXT.md](https://github.com/luanAfons0/daily/blob/main/CONTEXT.md)
        and the [ADRs](https://github.com/luanAfons0/daily/tree/main/docs/adr)
        first.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What you were trying to do with an Entry, a Note, a Cycle or the
        Meeting, and where Daily stopped you. Describe the problem, not the
        solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
      description: >
        If you have a shape in mind, give the tool call you wish existed and
        what it would answer, or what the Page would show.
    validations:
      required: false

  - type: textarea
    id: today
    attributes:
      label: How you work around it today
    validations:
      required: false

  - type: textarea
    id: decisions
    attributes:
      label: Decisions it touches
      description: >
        Name any ADR your request contradicts, here or in FirstMate, if you
        found one. Contradicting an ADR is allowed; doing it quietly is not.
    validations:
      required: false
