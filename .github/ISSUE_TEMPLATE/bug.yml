name: Bug report
description: An Entry or a Note went somewhere it should not, a Cycle is wrong, or the Page says something wrong.
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Your Entries and Notes are your own work notes. Leave their text out,
        or replace it, unless the text is the bug. Never attach `worklog.db`,
        and never paste FirstMate's token or `runtime.json`.

        If this is a security problem, do not file it here. See
        [SECURITY.md](https://github.com/luanAfons0/worklog/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >
        What Worklog did, and what you expected instead. Name the Entry's Status
        before and after, and which Cycle it was in.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: >
        The steps on the Plugin Page, or the tool calls and their answers, from
        a Worklog that starts empty. `start_cycle`, `create_entry` and
        `update_entry` with their arguments are usually the answer.
    validations:
      required: true

  - type: textarea
    id: journal
    attributes:
      label: What the journal says
      description: >
        The lines from `journalctl --user -u firstmate` that start with
        `worklog:`, around the time it went wrong.
      render: shell
    validations:
      required: false

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: >
        The output of `node -v; uname -sr`, the FirstMate version, the
        browser, and whether you are on WSL.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: suite
    attributes:
      label: The suite
      options:
        - label: I ran `npm test` and said above whether it passed.
          required: false
