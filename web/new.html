<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Daily — add</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20x%3D%275%27%20y%3D%275%27%20width%3D%2722%27%20height%3D%2722%27%20rx%3D%275%27%20fill%3D%27none%27%20stroke%3D%27%2316456b%27%20stroke-width%3D%273%27%2F%3E%3Cpath%20d%3D%27M10.5%2016.5l3.5%203.5%207.5-8%27%20fill%3D%27none%27%20stroke%3D%27%2316456b%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="app.css">
</head>
<!-- The form a FirstMate Shortcut opens in a Popup: add an Entry or a Note
     from anywhere, and be gone. After a save it goes to the main Plugin Page,
     which leaves the Popup's address, so the Popup hides by itself; in a
     normal browser it simply lands there. -->
<body class="popup">
<main class="quick">
  <form class="quick-form" id="quick" autocomplete="off">
    <!-- A breadcrumb, as the place this lands: Daily, then what is made. -->
    <div class="quick-hd">
      <span class="crumb"><span class="mark" aria-hidden="true"></span>Daily</span>
      <span class="crumb-sep" aria-hidden="true">›</span>
      <div class="kinds" role="radiogroup" aria-label="Add">
        <label class="pill"><input type="radio" name="kind" value="entry" checked><span>Entry</span></label>
        <label class="pill"><input type="radio" name="kind" value="note"><span>Note</span></label>
      </div>
      <span class="crumb-sep" aria-hidden="true">›</span>
      <!-- New, or one already there to edit: an Entry of the current Cycle,
           or a Note, chosen by its title. new.js fills the list. -->
      <select class="pick" id="q-pick" aria-label="New, or which one to edit">
        <option value="">New</option>
      </select>
      <button class="quick-close" id="q-close" type="button" aria-label="Close" title="Close (Esc)"></button>
    </div>

    <div class="quick-sheet">
      <!-- The ring before the title shows the Status the Entry will have. -->
      <div class="quick-line" id="q-line">
        <span class="ring todo" id="q-ring" aria-hidden="true"></span>
        <input class="quick-title" id="q-title" type="text" placeholder="What are you working on?" aria-label="Title" autofocus>
      </div>
      <textarea class="quick-body" id="q-body" rows="3" placeholder="Add details, in Markdown…" aria-label="Body"></textarea>
    </div>

    <!-- A Status belongs to an Entry. A Note has none, so this hides for one. -->
    <div class="chips" id="q-statuses" role="radiogroup" aria-label="Status">
      <label class="chip"><input type="radio" name="status" value="Todo" checked><span><i class="ring todo"></i>Todo</span></label>
      <label class="chip"><input type="radio" name="status" value="In Progress"><span><i class="ring doing"></i>In Progress</span></label>
      <label class="chip"><input type="radio" name="status" value="Done"><span><i class="ring done"></i>Done</span></label>
    </div>

    <div id="q-banner" class="banner" role="alert" hidden></div>

    <div class="quick-foot">
      <span class="hint">Enter saves · Shift+Enter for a new line · Esc closes</span>
      <button class="act go" id="q-save" type="submit">Save Entry</button>
    </div>
  </form>
</main>
<script src="rpc.js"></script>
<script src="new.js"></script>
</body>
</html>
